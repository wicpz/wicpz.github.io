<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WICPZ Scripts — Static SPA</title>

  <!-- Fonts (close visual match to original) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050508;
      --card:#0c0c0f;
      --muted:#9aa1a6;
      --primary:#00f6ff;
      --accent:#7cfff6;
      --glass: rgba(255,255,255,0.03);
    }
    html,body{height:100%;margin:0;background:var(--bg);color:#e6eef6;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;line-height:1.2}
    body {
      background-image:
        radial-gradient(1200px 1200px at 10% 10%, rgba(0,246,255,0.03), transparent 6%),
        radial-gradient(800px 800px at 90% 90%, rgba(124,255,246,0.02), transparent 6%),
        linear-gradient(180deg, rgba(255,255,255,0.015), rgba(0,0,0,0.02));
      background-color: var(--bg);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .min-h-screen { min-height:100vh; }
    .container { max-width:1200px; margin:0 auto; padding:0 1rem; }

    /* Navbar */
    .navbar{
      display:flex;align-items:center;justify-content:space-between;
      padding:1rem 0;
      position:sticky;top:0;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
      backdrop-filter: blur(6px); z-index:60; border-bottom:1px solid rgba(255,255,255,0.03);
    }
    .brand { display:flex; align-items:center; gap:.75rem; font-weight:800; letter-spacing:.08em; font-family: Inter, sans-serif; }
    .brand .logo { width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#00c6ff); box-shadow:0 4px 18px rgba(0,246,255,0.06), inset 0 -6px 18px rgba(255,255,255,0.03); display:flex;align-items:center;justify-content:center;font-weight:800;color:#031018;font-family:monospace }
    .nav-actions { display:flex; gap:.5rem; align-items:center; }

    .nav-links { display:flex; gap:.6rem; align-items:center; margin-left:1rem; }
    .nav-link { color:var(--muted); text-decoration:none; font-family: "JetBrains Mono", monospace; padding:.35rem .6rem; border-radius:6px; }
    .nav-link.active { color:white; background:rgba(0,246,255,0.04); border:1px solid rgba(0,246,255,0.03); }

    /* Hero */
    .hero { padding-top:4.5rem; padding-bottom:3.5rem; text-align:center; }
    .hero .max { max-width:900px; margin:0 auto; }
    .glow { text-shadow:0 0 12px rgba(0,246,255,0.12), 0 0 28px rgba(0,246,255,0.06); color: #ffffff; }
    .title { font-size:3.25rem; line-height:1; font-weight:800; font-family:Inter, system-ui; margin:0 0 .5rem; }
    .subtitle { color:var(--muted); font-family: "JetBrains Mono", monospace; margin:0 auto; max-width:46rem; }

    /* GlitchText effect */
    .glitch {
      position:relative; display:inline-block;
    }
    .glitch::before, .glitch::after {
      content: attr(data-text);
      position:absolute; left:0; top:0; width:100%;
      pointer-events:none;
      mix-blend-mode:screen;
      opacity:.85;
    }
    .glitch::before { transform:translateX(-2px); color: rgba(255,255,255,0.08); filter:blur(.5px); }
    .glitch::after { transform:translateX(2px); color: rgba(0,246,255,0.08); filter:blur(1px); }

    /* Search */
    .search-wrap { display:flex; justify-content:center; margin-top:1.25rem; }
    .search {
      position:relative; width:100%; max-width:520px;
    }
    .search input {
      width:100%; padding: .95rem 1rem .95rem 3.25rem; border-radius:999px; border:1px solid rgba(0,246,255,0.08);
      background: rgba(0,0,0,0.45); color: #eafcff; outline:none; font-family: "JetBrains Mono", monospace; font-size:1rem;
      box-shadow: 0 6px 30px rgba(0,246,255,0.02), 0 0 12px rgba(0,246,255,0.01);
    }
    .search svg { position:absolute; left:12px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); }

    /* Main grid */
    main { padding-bottom:3rem; }
    .grid { display:grid; grid-template-columns: repeat(1,1fr); gap:1.25rem; }
    @media(min-width:720px){ .grid{ grid-template-columns: repeat(2,1fr);} }
    @media(min-width:1100px){ .grid{ grid-template-columns: repeat(3,1fr);} }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.008));
      border:1px solid rgba(255,255,255,0.03);
      padding:1rem; border-radius:10px; position:relative; overflow:hidden;
      transition: transform .16s ease, box-shadow .16s ease;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(0,0,0,0.7); }
    .card h3 { margin:0 0 .4rem; font-size:1.05rem; font-weight:700; color:#fff; }
    .meta { font-family: "JetBrains Mono", monospace; color:var(--muted); font-size:0.85rem; display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; }
    .tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:.6rem; }
    .tag { font-size:.72rem; padding:.18rem .45rem; border-radius:6px; border:1px solid rgba(0,246,255,0.06); color:var(--primary); background:rgba(0,246,255,0.02); }

    .card .actions { position:absolute; right:12px; bottom:12px; display:flex; gap:.5rem; }
    .btn {
      display:inline-flex; align-items:center; gap:.4rem; padding:.4rem .6rem; border-radius:8px; font-family: "JetBrains Mono", monospace; font-size:.78rem;
      background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.02); color:var(--muted); cursor:pointer;
    }
    .btn:active{ transform:translateY(1px); }
    .btn.primary { color: #02182a; background: linear-gradient(90deg, var(--primary), #00c6ff); border:none; box-shadow:0 6px 14px rgba(0,246,255,0.06); }
    .btn.danger { background: linear-gradient(90deg,#ff6b6b,#ff3b3b); color:white; border:none; }

    .status { display:inline-flex; align-items:center; gap:.4rem; padding:.25rem .5rem; border-radius:8px; font-size:.78rem; font-family: "JetBrains Mono", monospace; }
    .status.verified { background: rgba(56,196,104,0.08); color:#9ff4bd; border:1px solid rgba(56,196,104,0.08); }
    .status.unverified { background: rgba(242,191,73,0.06); color:#ffd88c; border:1px solid rgba(242,191,73,0.04); }

    /* Modal / drawer */
    .modal-backdrop { position:fixed; left:0; top:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:120; }
    .modal { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border:1px solid rgba(255,255,255,0.03); width:100%; max-width:820px; border-radius:12px; padding:1rem; box-shadow:0 20px 60px rgba(0,0,0,0.7); color:#eafcff; }
    .modal h3 { margin:0 0 .6rem; }
    .form-row { display:flex; gap:.6rem; margin-bottom:.6rem; }
    .form-row input[type="text"], .form-row textarea { width:100%; padding:.6rem .7rem; border-radius:8px; border:1px solid rgba(255,255,255,0.03); background: rgba(0,0,0,0.45); color:inherit; font-family: "JetBrains Mono", monospace; }
    textarea { min-height:120px; resize:vertical; }

    /* Footer */
    footer { margin-top:3rem; padding:2.25rem 0; text-align:center; border-top:1px solid rgba(255,255,255,0.03); color:var(--muted); font-family: "JetBrains Mono", monospace; font-size:.85rem; }

    /* toast */
    .toast {
      position:fixed; right:18px; bottom:18px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); color:#e9ffff;
      padding:.72rem .9rem; border-radius:10px; border:1px solid rgba(0,246,255,0.06); box-shadow:0 10px 30px rgba(0,0,0,0.6); font-family: "JetBrains Mono", monospace;
      transform:translateY(12px); opacity:0; transition: all .25s ease;
    }
    .toast.show { transform:none; opacity:1; }

    .admin-bar { display:flex; gap:.5rem; align-items:center; }
    .admin-pill { font-family: "JetBrains Mono", monospace; color:var(--muted); padding:.4rem .6rem; border-radius:999px; background:rgba(255,255,255,0.01); border:1px solid rgba(255,255,255,0.02); }

    @media(max-width:560px){ .title{font-size:2rem} .card .actions { position:static; margin-top:8px; justify-content:flex-end; } }
  </style>
</head>
<body>
  <div class="min-h-screen">
    <header class="navbar container">
      <div style="display:flex;align-items:center">
        <div class="brand">
          <div class="logo">W</div>
          <div>
            <div style="font-size:.78rem;color:var(--muted);letter-spacing:.12em">WICPZ</div>
            <div style="font-size:.95rem">Scripts</div>
          </div>
        </div>

        <nav class="nav-links" aria-label="Primary">
          <a class="nav-link" href="#/" data-route="/">Home</a>
          <a class="nav-link" href="#/add" data-route="/add">Add</a>
          <a class="nav-link" href="#/dashboard" data-route="/dashboard">Dashboard</a>
        </nav>
      </div>

      <div class="nav-actions">
        <div class="admin-bar" id="adminBar">
          <div class="admin-pill" id="adminStatus">Not signed in</div>
          <button class="btn" id="adminBtn">Moderator</button>
        </div>
      </div>
    </header>

    <main class="container" id="appRoot" style="padding-bottom:3rem"></main>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite">Copied</div>

  <!-- Modal container (for edit) -->
  <div id="modalContainer" style="display:none"></div>

  <script>
    /**************************************************************************
     * Single-file SPA with multiple pages, moderator auth and edit/unverify
     * Moderator key (as requested): WICP-Moderator-7f9X2bLq
     *
     * Data persists in localStorage (scripts_v1).
     **************************************************************************/

    const MODERATOR_KEY = 'WICP-Moderator-7f9X2bLq';

    // Seed data (same items as provided)
    const SEED_DATA = [
      { id:1, title: "Infinite Yield", game: "Universal", tags: ["admin","utility"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source"))()' },
      { id:2, title: "Simple ESP", game: "Universal", tags: ["esp","vision"], isVerified: false, code: 'for i,v in pairs(game.Players:GetPlayers()) do print(v.Name) end' },
      { id:3, title: "Dex Explorer", game: "Universal", tags: ["explorer","gui"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/peyton2465/Dex/master/out.lua"))()' },
      { id:4, title: "CMD-X", game: "Universal", tags: ["admin","utility"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/CMD-X/CMD-X/master/Source"))()' },
      { id:5, title: "OwlHub", game: "Universal", tags: ["hub","universal"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/CriShoux/OwlHub/master/OwlHub.txt"))()' },
      { id:6, title: "DarkHub", game: "Universal", tags: ["hub","universal"], isVerified: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/DarkHubDev/DarkHub/master/Main"))()' },
      { id:7, title: "Unnamed ESP", game: "Universal", tags: ["esp","vision"], isVerified: false, code: 'loadstring(game:HttpGet("https://pastebin.com/raw/ZzQfK4bX"))()' },
      { id:8, title: "Fates Admin", game: "Universal", tags: ["admin","utility"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/fatesc/fates-admin/main/main.lua"))()' },
      { id:9, title: "Remote Spy", game: "Universal", tags: ["debug","spy"], isVerified: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/exxtremestuffs/SimpleSpySource/master/SimpleSpy.lua"))()' },
      { id:10, title: "DomainX", game: "Universal", tags: ["admin","utility"], isVerified: false, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/shlexware/DomainX/main/source"))()' },
      { id:11, title: "Lemon Hub", game: "Steal a brainrot", tags: ["hub"], isVerified: true, code: 'loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/c4281c3937ebd537cb9e860182e41141.lua"))()' },
      { id:12, title: "Voidware", game: "99 Nights", tags: ["hub"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/VapeVoidware/VW-Add/main/nightsintheforest.lua", true))()' },
      { id:13, title: "Astral Hub", game: "Blox fruits", tags: ["hub"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Overgustx2/Main/refs/heads/main/BloxFruits_25.html"))()' },
      { id:14, title: "Speed Hub X", game: "Universal", tags: ["hub"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/AhmadV99/Speed-Hub-X/main/Speed%20Hub%20X.lua", true))()' },
      { id:15, title: "H4x Scripts", game: "Universal", tags: ["hub"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/H4xScripts/Loader/refs/heads/main/loader.lua", true))()' },
      { id:16, title: "Teddy Hub", game: "Blox Fruits", tags: ["hub","keyless"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/Teddyseetink/Haidepzai/refs/heads/main/TeddyHub.lua"))()' },
      { id:17, title: "Redz Hub", game: "Blox Fruits", tags: ["hub","keyless"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/huy384/redzHub/refs/heads/main/redzHub.lua"))()' },
      { id:18, title: "Tuan Dzai Hub", game: "Blox Fruits", tags: ["hub","keyless"], isVerified: true, code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/AnhTuanDzai-Hub/TuanAnhIOS/refs/heads/main/TuanAnhIOS-Main.Lua"))()' }
    ];

    // app state
    let scripts = JSON.parse(localStorage.getItem('scripts_v1')) || SEED_DATA.slice();
    let adminKey = localStorage.getItem('wicp_admin_key') || null;

    // root nodes
    const root = document.getElementById('appRoot');
    const toastEl = document.getElementById('toast');
    const modalContainer = document.getElementById('modalContainer');
    const navLinks = document.querySelectorAll('.nav-link');
    const adminBtn = document.getElementById('adminBtn');
    const adminStatus = document.getElementById('adminStatus');

    // helpers
    function saveState(){ localStorage.setItem('scripts_v1', JSON.stringify(scripts)); }
    function showToast(msg='Done'){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 2000); }
    function isAdmin(){ return !!adminKey; }
    function setAdmin(key){ adminKey = key; if (key) localStorage.setItem('wicp_admin_key', key); else localStorage.removeItem('wicp_admin_key'); updateAdminUI(); }
    function updateAdminUI(){ adminStatus.textContent = isAdmin() ? 'Signed in' : 'Not signed in'; }

    // navigation
    function setActiveNav(route){
      navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('data-route') === route));
    }

    function router(){
      const hash = location.hash.replace(/^#/, '') || '/';
      // route match
      if (hash === '/' || hash.startsWith('/?')) {
        renderHome();
        setActiveNav('/');
      } else if (hash.startsWith('/dashboard')) {
        renderDashboard();
        setActiveNav('/dashboard');
      } else if (hash.startsWith('/script/')) {
        const id = Number(hash.split('/')[2]);
        renderScriptDetail(id);
        setActiveNav('/');
      } else if (hash === '/add') {
        renderAddPage();
        setActiveNav('/add');
      } else {
        renderHome();
        setActiveNav('/');
      }
    }

    window.addEventListener('hashchange', router);

    // rendering components/pages
    function renderHome(){
      root.innerHTML = `
        <section class="hero">
          <div class="max" style="text-align:center">
            <h1 class="title glow"><span class="glitch" data-text="ROBLOX SCRIPTS">ROBLOX SCRIPTS</span></h1>
            <p class="subtitle">Explore safe, verified, and high-quality scripts for your favorite games. Curated by the <span style="color:var(--primary)">WICPZ</span> moderation team.</p>
            <div class="search-wrap" style="margin-top:1.25rem">
              <div class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:18px;height:18px;color:var(--muted)">
                  <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <input id="homeSearch" placeholder="SEARCH SCRIPTS OR GAMES..." aria-label="Search scripts" />
              </div>
            </div>
          </div>
        </section>

        <section style="margin-top:1.25rem">
          <div id="cardsGrid" class="grid" aria-live="polite"></div>
        </section>
      `;
      document.getElementById('homeSearch').addEventListener('input', (e)=> renderGrid(e.target.value));
      renderGrid('');
      updateAdminUI();
    }

    function renderGrid(filter=''){
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      let list = scripts.slice();
      if (filter && filter.trim()){
        const q = filter.toLowerCase();
        list = list.filter(s => s.title.toLowerCase().includes(q) || (s.game || '').toLowerCase().includes(q) || (s.tags || []).some(t => t.toLowerCase().includes(q)));
      }
      if (list.length === 0){
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted);font-family:JetBrains Mono">NO SCRIPTS FOUND MATCHING QUERY.</div>';
        return;
      }
      for (const item of list){
        grid.appendChild(cardElement(item));
      }
    }

    function cardElement(item){
      const div = document.createElement('div');
      div.className = 'card';
      div.setAttribute('data-id', item.id);
      div.innerHTML = `
        <div>
          <h3>${escapeHtml(item.title)}</h3>
          <div class="meta">
            <div>${escapeHtml(item.game || '-')}</div>
            <div style="margin-left:auto" class="status ${item.isVerified ? 'verified' : 'unverified'}">
              ${item.isVerified ? iconVerified() : iconUnverified()}
              <span style="font-size:.85rem">${item.isVerified ? 'Verified' : 'Unverified'}</span>
            </div>
          </div>
          <div class="tags" style="margin-top:.6rem">
            ${(item.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
          </div>
          <div style="margin-top:.9rem; color:var(--muted); font-family:JetBrains Mono; font-size:.82rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            ${escapeHtml(item.code)}
          </div>
        </div>
        <div class="actions">
          <button class="btn" data-action="view">View</button>
          <button class="btn" data-action="copy">Copy</button>
          <button class="btn" data-action="toggle">${item.isVerified ? 'Unverify' : 'Verify'}</button>
          <button class="btn danger" data-action="delete">Delete</button>
        </div>
      `;

      div.querySelector('[data-action="view"]').addEventListener('click', () => {
        location.hash = `#/script/${item.id}`;
      });

      div.querySelector('[data-action="copy"]').addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(item.code); showToast('Copied code'); } catch(e){ showToast('Copy failed'); }
      });

      div.querySelector('[data-action="toggle"]').addEventListener('click', () => {
        if (!isAdmin()) { promptAdmin(); return; }
        item.isVerified = !item.isVerified;
        saveState();
        renderGrid(document.getElementById('homeSearch') ? document.getElementById('homeSearch').value : '');
        showToast(item.isVerified ? 'Script verified' : 'Script unverified');
      });

      div.querySelector('[data-action="delete"]').addEventListener('click', () => {
        if (!isAdmin()) { promptAdmin(); return; }
        if (!confirm('Are you sure you want to delete this script?')) return;
        scripts = scripts.filter(s => s.id !== item.id);
        saveState();
        renderGrid(document.getElementById('homeSearch') ? document.getElementById('homeSearch').value : '');
        showToast('Script deleted');
      });

      return div;
    }

    function renderDashboard(){
      if (!isAdmin()){
        // make dashboard accessible but prompt sign-in; still allow read-only view
        root.innerHTML = `<div style="padding:3rem 0;text-align:center;color:var(--muted);font-family:JetBrains Mono">
          <p style="margin:0 0 1rem">Moderator dashboard (sign in required for edits)</p>
          <button class="btn" id="promptSignIn">Sign in as Moderator</button>
          <div style="margin-top:1rem" id="dashboardGrid"></div>
        </div>`;
        document.getElementById('promptSignIn').addEventListener('click', promptAdmin);
        renderDashboardGrid();
        return;
      }

      root.innerHTML = `
        <div style="padding:1rem 0 0 0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
            <div>
              <h1 style="margin:0;font-family:Inter;font-weight:800">MODERATOR DASHBOARD</h1>
              <p style="margin:0;color:var(--muted);font-family:JetBrains Mono">MANAGE REPOSITORY CONTENT</p>
            </div>
            <div style="display:flex;gap:.5rem;align-items:center">
              <div class="admin-pill">Total Scripts: ${scripts.length}</div>
            </div>
          </div>

          <div id="dashboardGrid"></div>
        </div>
      `;
      renderDashboardGrid();
    }

    function renderDashboardGrid(){
      const el = document.getElementById('dashboardGrid') || root.querySelector('#dashboardGrid');
      if (!el) return;
      el.innerHTML = `
        <div style="overflow-x:auto">
          <table style="width:100%;border-collapse:collapse;font-family:JetBrains Mono;color:var(--muted);">
            <thead style="text-align:left;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--muted)">
              <tr><th style="padding:.75rem">ID</th><th style="padding:.75rem">Title</th><th style="padding:.75rem">Game</th><th style="padding:.75rem">Tags</th><th style="padding:.75rem">Status</th><th style="padding:.75rem;text-align:right">Actions</th></tr>
            </thead>
            <tbody id="dashRows"></tbody>
          </table>
        </div>
      `;
      const tbody = document.getElementById('dashRows');
      tbody.innerHTML = '';
      for (const s of scripts){
        const tr = document.createElement('tr');
        tr.style.borderBottom = '1px solid rgba(255,255,255,0.02)';
        tr.innerHTML = `
          <td style="padding:.75rem;vertical-align:middle">#${s.id}</td>
          <td style="padding:.75rem;vertical-align:middle;color:white;font-weight:600">${escapeHtml(s.title)}</td>
          <td style="padding:.75rem;vertical-align:middle">${escapeHtml(s.game || '-')}</td>
          <td style="padding:.75rem;vertical-align:middle">${(s.tags||[]).map(t => `<span class="tag" style="margin-right:4px">${escapeHtml(t)}</span>`).join('')}</td>
          <td style="padding:.75rem;vertical-align:middle">${s.isVerified ? '<span class="status verified">Verified</span>' : '<span class="status unverified">Unverified</span>'}</td>
          <td style="padding:.75rem;vertical-align:middle;text-align:right">
            <button class="btn" data-action="edit" data-id="${s.id}">Edit</button>
            <button class="btn" data-action="toggle" data-id="${s.id}">${s.isVerified ? 'Unverify' : 'Verify'}</button>
            <button class="btn danger" data-action="delete" data-id="${s.id}">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      }

      // attach events
      tbody.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        const s = scripts.find(x => x.id === id);
        if (!s) return;
        openEditModal(s);
      }));

      tbody.querySelectorAll('[data-action="toggle"]').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        const s = scripts.find(x => x.id === id);
        if (!s) return;
        s.isVerified = !s.isVerified;
        saveState();
        renderDashboard();
        showToast(s.isVerified ? 'Script verified' : 'Script unverified');
      }));

      tbody.querySelectorAll('[data-action="delete"]').forEach(b => b.addEventListener('click', (e) => {
        const id = Number(e.currentTarget.getAttribute('data-id'));
        if (!confirm('Are you sure you want to delete this script?')) return;
        scripts = scripts.filter(x => x.id !== id);
        saveState();
        renderDashboard();
        showToast('Script deleted');
      }));
    }

    function renderScriptDetail(id){
      const s = scripts.find(x => x.id === id);
      if (!s){
        root.innerHTML = `<div style="padding:3rem 0;text-align:center;color:var(--muted);font-family:JetBrains Mono">Script not found</div>`;
        return;
      }
      root.innerHTML = `
        <div style="display:flex;gap:1rem;flex-wrap:wrap;padding-top:1rem">
          <div style="flex:1;min-width:280px">
            <div class="card">
              <h3>${escapeHtml(s.title)}</h3>
              <div class="meta" style="margin-bottom:.6rem">
                <div>${escapeHtml(s.game || '-')}</div>
                <div style="margin-left:auto" class="status ${s.isVerified ? 'verified':'unverified'}">${s.isVerified ? iconVerified() : iconUnverified()}<span>${s.isVerified ? 'Verified' : 'Unverified'}</span></div>
              </div>
              <div style="margin-top:.6rem">${(s.tags||[]).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>

              <pre style="margin-top:.9rem; background:rgba(0,0,0,0.45); padding:.8rem; border-radius:8px; overflow:auto; color:#dff;"><code>${escapeHtml(s.code)}</code></pre>

              <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">
                <button class="btn" id="viewCopy">Copy</button>
                <button class="btn" id="viewEdit">Edit</button>
              </div>
            </div>
          </div>

          <div style="flex:1;min-width:260px">
            <div class="card">
              <h3 style="margin-top:0">Actions</h3>
              <div style="display:flex;flex-direction:column;gap:.6rem">
                <button class="btn" id="detailToggle">${s.isVerified ? 'Unverify' : 'Verify'}</button>
                <button class="btn danger" id="detailDelete">Delete</button>
                <button class="btn" id="backBtn">Back</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('viewCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(s.code); showToast('Copied code'); } catch(e){ showToast('Copy failed'); } });
      document.getElementById('viewEdit').addEventListener('click', () => { if (!isAdmin()) { promptAdmin(); return; } openEditModal(s); });
      document.getElementById('detailToggle').addEventListener('click', () => { if (!isAdmin()) { promptAdmin(); return; } s.isVerified = !s.isVerified; saveState(); renderScriptDetail(id); showToast(s.isVerified ? 'Script verified' : 'Script unverified'); });
      document.getElementById('detailDelete').addEventListener('click', () => { if (!isAdmin()) { promptAdmin(); return; } if (!confirm('Delete this script?')) return; scripts = scripts.filter(x => x.id !== id); saveState(); showToast('Deleted'); location.hash = '#/'; });
      document.getElementById('backBtn').addEventListener('click', ()=> location.hash = '#/');
    }

    function renderAddPage(){
      root.innerHTML = `
        <div style="max-width:900px;margin:1rem auto">
          <div class="card">
            <h3>Add New Script</h3>
            <div style="display:flex;flex-direction:column;gap:.6rem">
              <input id="addTitle" placeholder="Title (required)" />
              <input id="addGame" placeholder="Game (optional)" />
              <input id="addTags" placeholder="Tags (comma separated)" />
              <textarea id="addCode" placeholder="Code (required)"></textarea>
              <div style="display:flex;gap:.5rem;justify-content:flex-end">
                <button class="btn" id="addSave">Save</button>
                <button class="btn" id="addCancel">Cancel</button>
              </div>
            </div>
          </div>
        </div>
      `;
      document.getElementById('addCancel').addEventListener('click', ()=> location.hash = '#/');
      document.getElementById('addSave').addEventListener('click', ()=> {
        const title = document.getElementById('addTitle').value.trim();
        const game = document.getElementById('addGame').value.trim();
        const tags = document.getElementById('addTags').value.split(',').map(t=>t.trim()).filter(Boolean);
        const code = document.getElementById('addCode').value.trim();
        if (!title || !code) { showToast('Title and code required'); return; }
        const nextId = scripts.length ? Math.max(...scripts.map(s=>s.id)) + 1 : 1;
        const newScript = { id: nextId, title, game: game||null, tags, isVerified: false, code };
        // require moderator to create verified content? creation allowed without mod; moderation can verify later
        scripts.push(newScript);
        saveState();
        showToast('Script added');
        location.hash = '#/';
      });
    }

    // modal for editing script
    function openEditModal(script){
      modalContainer.style.display = 'block';
      modalContainer.innerHTML = `
        <div class="modal-backdrop" role="dialog" aria-modal="true">
          <div class="modal">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <h3>Edit Script #${script.id}</h3>
              <div style="display:flex;gap:.5rem">
                <button class="btn" id="modalSave">Save</button>
                <button class="btn" id="modalClose">Close</button>
              </div>
            </div>

            <div style="margin-top:.8rem">
              <div class="form-row">
                <input type="text" id="editTitle" placeholder="Title" value="${escapeAttr(script.title)}" />
                <input type="text" id="editGame" placeholder="Game" value="${escapeAttr(script.game||'')}" />
              </div>
              <div class="form-row">
                <input type="text" id="editTags" placeholder="Tags (comma separated)" value="${escapeAttr((script.tags||[]).join(','))}" />
                <label style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="editVerified" ${script.isVerified ? 'checked' : ''}/> Verified</label>
              </div>
              <div style="margin-top:.6rem">
                <textarea id="editCode" placeholder="Code">${escapeHtml(script.code)}</textarea>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalSave').addEventListener('click', () => {
        const title = document.getElementById('editTitle').value.trim();
        const game = document.getElementById('editGame').value.trim();
        const tags = document.getElementById('editTags').value.split(',').map(t=>t.trim()).filter(Boolean);
        const code = document.getElementById('editCode').value.trim();
        const verified = document.getElementById('editVerified').checked;
        if (!title || !code){ showToast('Title and code required'); return; }
        // commit changes
        script.title = title;
        script.game = game || null;
        script.tags = tags;
        script.code = code;
        script.isVerified = !!verified;
        saveState();
        closeModal();
        // re-render current view
        router();
        showToast('Saved');
      });

      // allow clicking backdrop to close
      modalContainer.querySelector('.modal-backdrop').addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-backdrop')) closeModal();
      });
    }

    function closeModal(){
      modalContainer.style.display = 'none';
      modalContainer.innerHTML = '';
    }

    // auth prompt
    function promptAdmin(){
      const key = prompt('Enter moderator key:');
      if (!key) return;
      if (key === MODERATOR_KEY){
        setAdmin(key);
        showToast('Moderator signed in');
      } else {
        showToast('Invalid key');
      }
    }

    // simple UI helpers & icons
    function escapeHtml(s){ return String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
    function escapeAttr(s){ return String(s || '').replace(/"/g, '&quot;'); }
    function iconVerified(){ return `<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:middle;color:#9ff4bd"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
    function iconUnverified(){ return `<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:middle;color:#ffd88c"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

    // small utilities for console debugging
    window._wicpz = {
      get scripts(){ return scripts; },
      setAdmin: (k) => setAdmin(k),
      seed: () => { scripts = SEED_DATA.slice(); saveState(); showToast('Re-seeded'); router(); }
    };

    // admin button behavior
    adminBtn.addEventListener('click', () => {
      if (isAdmin()){
        if (confirm('Sign out moderator?')) { setAdmin(null); showToast('Signed out'); }
      } else {
        promptAdmin();
      }
    });

    // update nav highlighting and initial render
    updateAdminUI();
    router();

    // keep nav active when clicking anchors
    document.querySelectorAll('.nav-link').forEach(a => {
      a.addEventListener('click', () => {
        // allow hashchange to trigger router; small delay to set active class properly
        setTimeout(()=> setActiveNav(a.getAttribute('data-route')), 1);
      });
    });

    // Expose some icons/buttons for copy (global)
    document.addEventListener('click', (e) => {
      // no-op placeholder for global delegation if needed
    });

    // initial focus improvements
    window.addEventListener('load', () => {
      const h = location.hash || '#/';
      if (h === '#/') {
        const input = document.getElementById('homeSearch');
        if (input) input.focus();
      }
    });
  </script>
</body>
</html>
