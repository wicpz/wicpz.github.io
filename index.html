<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WICPZ — Roblox Scripts (local)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#06f0e8; --bg0:#041024; --bg1:#061430; --muted:#9fb0c8; --primary:#00f6ff;
  --card-radius:12px; --max-width:1120px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;
  color:#e6f3fb;line-height:1.45;
  background:
    radial-gradient(800px 400px at 10% 8%, rgba(6,240,232,0.04), transparent 10%),
    radial-gradient(600px 300px at 95% 90%, rgba(0,0,0,0.12), transparent 20%),
    linear-gradient(180deg,var(--bg0) 0%, var(--bg1) 100%);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
.container{max-width:var(--max-width);margin:0 auto;padding:0 1rem}
.navbar{
  display:flex;align-items:center;justify-content:space-between;padding:20px 0;
  position:sticky;top:0;background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
  border-bottom:1px solid rgba(255,255,255,0.02);backdrop-filter:blur(6px);z-index:60;
}
.brand{display:flex;align-items:center;gap:.75rem;font-weight:800}
.brand .logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#00c6ff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#031018;font-family:monospace;box-shadow:0 6px 26px rgba(6,240,232,0.04), inset 0 -6px 18px rgba(255,255,255,0.02)}
.title-small{font-size:.78rem;color:var(--muted);letter-spacing:.12em}
.title-large{font-size:.95rem}
.nav-links{display:flex;gap:.6rem;align-items:center;margin-left:1rem}
.nav-link{color:var(--muted);text-decoration:none;font-family:"JetBrains Mono",monospace;padding:.35rem .6rem;border-radius:8px}
.nav-link.active{color:white;background:rgba(6,240,232,0.06);border:1px solid rgba(6,240,232,0.03)}
.admin-pill{font-family:"JetBrains Mono",monospace;color:var(--muted);padding:.4rem .6rem;border-radius:999px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)}
.hero{padding-top:36px;padding-bottom:28px;text-align:center}
.title{font-size:2.75rem;line-height:1;margin:0 0 .5rem;font-weight:800;font-family:Inter,system-ui}
.subtitle{color:var(--muted);font-family:"JetBrains Mono",monospace;margin:0 auto;max-width:46rem}
.search-wrap{display:flex;justify-content:center;margin-top:1.25rem}
.search{position:relative;width:100%;max-width:520px}
.search input{width:100%;padding:.95rem 1rem .95rem 3.25rem;border-radius:999px;border:1px solid rgba(6,240,232,0.08);background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(0,0,0,0.18));color:#eafcff;outline:none;font-family:"JetBrains Mono",monospace;font-size:1rem;box-shadow:0 8px 40px rgba(6,240,232,0.02)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(1,1fr)}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:linear-gradient(180deg, rgba(255,255,255,0.012), rgba(0,0,0,0.03));border:1px solid rgba(255,255,255,0.02);padding:16px;border-radius:var(--card-radius);position:relative;overflow:hidden;transition:transform .16s ease,box-shadow .16s ease;box-shadow:0 6px 30px rgba(2,8,23,0.6)}
.card:hover{transform:translateY(-8px);box-shadow:0 18px 48px rgba(2,8,23,0.7)}
.card h3{margin:0 0 .45rem;font-size:1.05rem;font-weight:700;color:#fff}
.meta{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.85rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:.72rem;padding:.18rem .5rem;border-radius:8px;border:1px solid rgba(6,240,232,0.06);color:var(--primary);background:rgba(0,246,255,0.02);font-family:"JetBrains Mono",monospace}
pre{background:linear-gradient(180deg, rgba(0,6,23,0.5), rgba(0,6,23,0.35));padding:12px;border-radius:10px;overflow:auto;font-size:13px;line-height:1.5;color:#dff6ff;border:1px solid rgba(255,255,255,0.02);font-family:"JetBrains Mono",monospace;margin-top:10px}
.actions{position:absolute;right:12px;bottom:12px;display:flex;gap:.5rem}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.45rem .65rem;border-radius:10px;font-family:"JetBrains Mono",monospace;font-size:.82rem;background:linear-gradient(90deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));color:var(--muted);border:1px solid rgba(255,255,255,0.02);cursor:pointer}
.btn.primary{color:#00161a;background:linear-gradient(90deg,var(--accent),#58f3e6);border:none;box-shadow:0 8px 24px rgba(6,240,232,0.06)}
.btn.danger{background:linear-gradient(90deg,#ff6b6b,#ff3b3b);color:white;border:none}
.status{display:inline-flex;align-items:center;gap:.4rem;padding:.28rem .5rem;border-radius:10px;font-size:.8rem;font-family:"JetBrains Mono",monospace}
.status.verified{background:linear-gradient(90deg,#1ff7a0,#a5ffcf);color:#012217;border:1px solid rgba(255,255,255,0.02)}
.status.unverified{background:rgba(242,191,73,0.06);color:#ffd88c;border:1px solid rgba(242,191,73,0.04)}
.modal-backdrop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:120}
.modal{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.03);width:100%;max-width:880px;border-radius:14px;padding:16px;box-shadow:0 24px 80px rgba(0,0,0,0.75);color:#eafcff}
.form-row{display:flex;gap:.6rem;margin-bottom:.6rem}
.form-row input[type="text"],.form-row textarea{width:100%;padding:.7rem .8rem;border-radius:10px;border:1px solid rgba(255,255,255,0.03);background:rgba(0,0,0,0.45);color:inherit;font-family:"JetBrains Mono",monospace}
.empty-slot{color:var(--muted);opacity:0.85;text-align:center;padding:36px 0;font-family:"JetBrains Mono",monospace;background:linear-gradient(180deg, rgba(255,255,255,0.005), transparent);border-radius:10px}
.pager{display:flex;justify-content:center;gap:12px;margin:20px 0;align-items:center}
.pager button{background:linear-gradient(90deg,var(--accent),#5eead4);color:#001617;padding:8px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:800}
.pager span{color:var(--muted);font-family:"JetBrains Mono",monospace}
footer{margin-top:3rem;padding:2rem 0;text-align:center;border-top:1px solid rgba(255,255,255,0.03);color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:.9rem;max-width:var(--max-width);margin-left:auto;margin-right:auto}
.toast{position:fixed;right:18px;bottom:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));color:#e9ffff;padding:.72rem .9rem;border-radius:10px;border:1px solid rgba(6,240,232,0.06);box-shadow:0 10px 30px rgba(0,0,0,0.6);font-family:"JetBrains Mono",monospace;transform:translateY(12px);opacity:0;transition:all .25s ease}.toast.show{transform:none;opacity:1}
@media(max-width:560px){.card .actions{position:static;margin-top:12px;display:flex;justify-content:flex-end}.navbar{padding:12px 0}.container{padding:0 12px}.title{font-size:1.6rem}}
</style>
</head>
<body>
  <div class="min-h-screen">
    <header class="navbar container">
      <div style="display:flex;align-items:center">
        <div class="brand">
          <div class="logo">W</div>
          <div>
            <div class="title-small">WICPZ</div>
            <div class="title-large">Scripts</div>
          </div>
        </div>
        <nav class="nav-links" aria-label="Primary" style="margin-left:16px">
          <a class="nav-link" href="#/" data-route="/">Home</a>
          <a class="nav-link" href="#/add" data-route="/add">Add</a>
          <a class="nav-link" href="#/dashboard" data-route="/dashboard">Dashboard</a>
        </nav>
      </div>
      <div class="nav-actions">
        <div class="admin-bar" id="adminBar">
          <div class="admin-pill" id="adminStatus">Not signed in</div>
          <button class="btn" id="adminBtn">Moderator</button>
        </div>
      </div>
    </header>

    <main class="container" id="appRoot" style="padding-bottom:3rem"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite">Copied</div>
  <div id="modalContainer" style="display:none"></div>

<script>
/**************************************************************************
 LocalStorage-backed SPA, seeded script data in-code.
 Each script object contains: title (string), tags (array), code (string, loadstring allowed),
 is_verified (boolean).
 No id field stored — scripts are referenced by index.
**************************************************************************/

const STORAGE_KEY = 'wicpz_scripts';
const MODERATOR_KEY = 'WICP-Moderator-7f9X2bLq';

// initial seed (edit here to change seeded scripts)
const INITIAL_SCRIPTS = [
  { title:"Infinite Yield", tags:["admin","utility"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/EdgeIY/infiniteyield/master/source"))()`, is_verified:true },
  { title:"Simple ESP", tags:["esp","vision"], code:`for i,v in pairs(game.Players:GetPlayers()) do print(v.Name) end`, is_verified:false },
  { title:"Dex Explorer", tags:["explorer","gui"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/peyton2465/Dex/master/out.lua"))()`, is_verified:true },
  { title:"CMD-X", tags:["admin","utility"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/CMD-X/CMD-X/master/Source"))()`, is_verified:true },
  { title:"OwlHub", tags:["hub","universal"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/CriShoux/OwlHub/master/OwlHub.txt"))()`, is_verified:true },
  { title:"DarkHub", tags:["hub","universal"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/DarkHubDev/DarkHub/master/Main"))()`, is_verified:false },
  { title:"Unnamed ESP", tags:["esp","vision"], code:`loadstring(game:HttpGet("https://pastebin.com/raw/ZzQfK4bX"))()`, is_verified:false },
  { title:"Fates Admin", tags:["admin","utility"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/fatesc/fates-admin/main/main.lua"))()`, is_verified:true },
  { title:"Remote Spy", tags:["debug","spy"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/exxtremestuffs/SimpleSpySource/master/SimpleSpy.lua"))()`, is_verified:false },
  { title:"DomainX", tags:["admin","utility"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/shlexware/DomainX/main/source"))()`, is_verified:false },
  { title:"Lemon Hub", tags:["fun"], code:`loadstring(game:HttpGet("https://api.luarmor.net/files/v3/loaders/c4281c3937ebd537cb9e860182e41141.lua"))()`, is_verified:true },
  { title:"Voidware", tags:["99 Nights"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/VapeVoidware/VW-Add/main/nightsintheforest.lua", true))()`, is_verified:true },
  { title:"Astral Hub", tags:["Blox fruits"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/Overgustx2/Main/refs/heads/main/BloxFruits_25.html"))()`, is_verified:true },
  { title:"Speed Hub X", tags:["multi"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/AhmadV99/Speed-Hub-X/main/Speed%20Hub%20X.lua", true))()`, is_verified:true },
  { title:"H4x Scripts", tags:["Universal"], code:`loadstring(game:HttpGet("https://raw.githubusercontent.com/H4xScripts/Loader/refs/heads/main/loader.lua", true))()`, is_verified:true },
  { title:"Example", tags:["Example"], code:"Example", is_verified:true },
  { title:"Example", tags:["Example"], code:"Example", is_verified:true }
];

// app state & roots
let scripts = [];
let adminKey = localStorage.getItem('wicpz_admin_key') || localStorage.getItem('wicp_admin_key') || localStorage.getItem('wicpz_admin') || localStorage.getItem('wicp_admin') || localStorage.getItem('wicpz_admin_key') || localStorage.getItem('wicp_admin_key') || localStorage.getItem('wicp_admin') || localStorage.getItem('wicpz_admin_value') || localStorage.getItem('wicp_admin_value') || localStorage.getItem('wicp_admin_key') || localStorage.getItem('wicp_admin_key') || localStorage.getItem('wicpz_admin_key') || localStorage.getItem('wicp_admin_key') || null;
if (!adminKey) adminKey = localStorage.getItem('wicp_admin_key') || null;
const root = document.getElementById('appRoot');
const toastEl = document.getElementById('toast');
const modalContainer = document.getElementById('modalContainer');
const navLinks = document.querySelectorAll('.nav-link');
const adminBtn = document.getElementById('adminBtn');
const adminStatus = document.getElementById('adminStatus');

function showToast(msg='Done'){ toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastEl._t); toastEl._t = setTimeout(()=> toastEl.classList.remove('show'), 2000); }
function isAdmin(){ return !!adminKey; }
function setAdmin(key){ adminKey = key; if (key) localStorage.setItem('wicp_admin_key', key); else localStorage.removeItem('wicp_admin_key'); updateAdminUI(); }
function updateAdminUI(){ adminStatus.textContent = isAdmin() ? 'Signed in' : 'Not signed in'; }

function normalizeScript(p){
  return {
    title: p.title || '',
    tags: Array.isArray(p.tags) ? p.tags : (p.tags ? String(p.tags).split(',').map(t=>t.trim()).filter(Boolean) : []),
    code: p.code || p.content || '',
    is_verified: !!p.is_verified
  };
}

function loadScriptsFromDb(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw){
    scripts = INITIAL_SCRIPTS.map(normalizeScript);
    saveScriptsToStorage();
  } else {
    try {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) scripts = parsed.map(normalizeScript);
      else scripts = INITIAL_SCRIPTS.map(normalizeScript);
    } catch (e){
      console.error('Failed to parse storage', e);
      scripts = INITIAL_SCRIPTS.map(normalizeScript);
      saveScriptsToStorage();
    }
  }
  router();
}

function saveScriptsToStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(scripts));
}

async function addScriptToDb(script){
  const item = {
    title: script.title,
    tags: script.tags || [],
    code: script.code,
    is_verified: !!script.isVerified
  };
  scripts.push(item);
  saveScriptsToStorage();
  return item;
}

async function updateScriptInDb(index, updates){
  if (index < 0 || index >= scripts.length) throw new Error('Not found');
  scripts[index] = {
    ...scripts[index],
    title: updates.title,
    tags: updates.tags,
    code: updates.code,
    is_verified: !!updates.isVerified
  };
  saveScriptsToStorage();
  return scripts[index];
}

async function deleteScriptInDb(index){
  if (index < 0 || index >= scripts.length) throw new Error('Not found');
  scripts.splice(index, 1);
  saveScriptsToStorage();
}

function subscribeRealtime(){ /* noop for localStorage */ }

function escapeHtml(s){ return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escapeAttr(s){ return escapeHtml(s); }
function iconVerified(){ return `<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:middle;color:#9ff4bd"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function iconUnverified(){ return `<svg viewBox="0 0 24 24" width="14" height="14" style="vertical-align:middle;color:#ffd88c"><path d="M18 6L6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }

window.addEventListener('hashchange', router);

function setActiveNav(route){ navLinks.forEach(a=>a.classList.toggle('active', a.getAttribute('data-route')===route)); }

function router(){
  const hash = location.hash.replace(/^#/, '') || '/';
  if (hash === '/' || hash.startsWith('/?')) { renderHome(); setActiveNav('/'); }
  else if (hash.startsWith('/dashboard')) { renderDashboard(); setActiveNav('/dashboard'); }
  else if (hash.startsWith('/script/')) { const idx = Number(hash.split('/')[2]); renderScriptDetail(idx); setActiveNav('/'); }
  else if (hash === '/add') { renderAddPage(); setActiveNav('/add'); }
  else { renderHome(); setActiveNav('/'); }
}

function renderHome(){
  root.innerHTML = `
    <section class="hero">
      <div class="max" style="text-align:center">
        <h1 class="title glow"><span class="glitch" data-text="ROBLOX SCRIPTS">ROBLOX SCRIPTS</span></h1>
        <p class="subtitle">Explore safe, verified, and high-quality scripts for your favorite games. Curated by the <span style="color:var(--primary)">WICPZ</span> moderation team.</p>
        <div class="search-wrap" style="margin-top:1.25rem">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:18px;height:18px;color:var(--muted)">
              <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <input id="homeSearch" placeholder="SEARCH SCRIPTS OR GAMES..." aria-label="Search scripts" />
          </div>
        </div>
      </div>
    </section>

    <section style="margin-top:1.25rem">
      <div id="cardsGrid" class="grid" aria-live="polite"></div>
    </section>
  `;
  document.getElementById('homeSearch').addEventListener('input', e => renderGrid(e.target.value));
  renderGrid('');
  updateAdminUI();
}

function renderGrid(filter=''){
  const grid = document.getElementById('cardsGrid'); grid.innerHTML='';
  let list = scripts.slice();
  if (filter && filter.trim()){
    const q = filter.toLowerCase();
    list = list.filter(s => (s.title||'').toLowerCase().includes(q) || (s.tags||[]).some(t => (t||'').toLowerCase().includes(q)));
  }
  if (list.length === 0){
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:3rem 1rem;color:var(--muted);font-family:JetBrains Mono">NO SCRIPTS FOUND MATCHING QUERY.</div>';
    return;
  }
  list.forEach((item, index) => {
    const div = document.createElement('div'); div.className='card';
    const adminControls = isAdmin() ? `
      <button class="btn" data-action="toggle" data-idx="${index}">${item.is_verified ? 'Unverify' : 'Verify'}</button>
      <button class="btn" data-action="edit" data-idx="${index}">Edit</button>
      <button class="btn danger" data-action="delete" data-idx="${index}">Delete</button>
    ` : '';
    div.innerHTML = `
      <div>
        <h3>${escapeHtml(item.title)}</h3>
        <div class="meta">
          <div>${escapeHtml((item.tags||[]).join(', ') || '-')}</div>
          <div style="margin-left:auto" class="status ${item.is_verified ? 'verified' : 'unverified'}">
            ${item.is_verified ? iconVerified() : iconUnverified()}
            <span style="font-size:.85rem">${item.is_verified ? 'Verified' : 'Unverified'}</span>
          </div>
        </div>
        <div class="tags" style="margin-top:.6rem">
          ${(item.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}
        </div>
        <pre style="margin-top:.9rem;color:#dff;"><code>${escapeHtml(item.code)}</code></pre>
      </div>
      <div class="actions">
        <button class="btn primary" data-action="view" data-idx="${index}">View</button>
        <button class="btn" data-action="copy" data-idx="${index}">Copy</button>
        ${adminControls}
      </div>
    `;
    grid.appendChild(div);
  });

  grid.querySelectorAll('[data-action="view"]').forEach(btn => btn.addEventListener('click', (e)=> {
    const idx = Number(e.currentTarget.getAttribute('data-idx')); location.hash = `#/script/${idx}`;
  }));
  grid.querySelectorAll('[data-action="copy"]').forEach(btn => btn.addEventListener('click', async (e)=> {
    const idx = Number(e.currentTarget.getAttribute('data-idx')); const code = scripts[idx]?.code || '';
    if (!code){ showToast('Nothing to copy'); return; }
    try{ await navigator.clipboard.writeText(code); showToast('Copied code'); } catch { showToast('Copy failed'); }
  }));
  grid.querySelectorAll('[data-action="toggle"]').forEach(btn => btn.addEventListener('click', async (e)=> {
    if (!isAdmin()){ promptAdmin(); return; }
    const idx = Number(e.currentTarget.getAttribute('data-idx'));
    try{ await updateScriptInDb(idx, {...scripts[idx], isVerified: !scripts[idx].is_verified}); showToast('Toggled'); loadScriptsFromDb(); } catch (err){ console.error(err); showToast('Update failed'); }
  }));
  grid.querySelectorAll('[data-action="edit"]').forEach(btn => btn.addEventListener('click', (e)=> {
    const idx = Number(e.currentTarget.getAttribute('data-idx')); openEditModalByIndex(idx);
  }));
  grid.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', async (e)=> {
    if (!isAdmin()){ promptAdmin(); return; }
    const idx = Number(e.currentTarget.getAttribute('data-idx'));
    if (!confirm('Delete this script?')) return;
    try{ await deleteScriptInDb(idx); showToast('Deleted'); loadScriptsFromDb(); } catch (err){ console.error(err); showToast('Delete failed'); }
  }));
}

function renderDashboard(){
  if (!isAdmin()){
    root.innerHTML = `<div style="padding:3rem 0;text-align:center;color:var(--muted);font-family:JetBrains Mono">
      <p style="margin:0 0 1rem">Moderator dashboard (sign in required for edits)</p>
      <button class="btn" id="promptSignIn">Sign in as Moderator</button>
      <div style="margin-top:1rem" id="dashboardGrid"></div>
    </div>`;
    document.getElementById('promptSignIn').addEventListener('click', promptAdmin);
    renderDashboardGrid();
    return;
  }

  root.innerHTML = `
    <div style="padding:1rem 0 0 0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <div>
          <h1 style="margin:0;font-family:Inter;font-weight:800">MODERATOR DASHBOARD</h1>
          <p style="margin:0;color:var(--muted);font-family:JetBrains Mono">MANAGE REPOSITORY CONTENT</p>
        </div>
        <div style="display:flex;gap:.5rem;align-items:center">
          <div class="admin-pill">Total Scripts: ${scripts.length}</div>
        </div>
      </div>
      <div id="dashboardGrid"></div>
    </div>
  `;
  renderDashboardGrid();
}

function renderDashboardGrid(){
  const el = document.getElementById('dashboardGrid') || root.querySelector('#dashboardGrid');
  if (!el) return;
  el.innerHTML = `<div style="overflow-x:auto">
    <table style="width:100%;border-collapse:collapse;font-family:JetBrains Mono;color:var(--muted);">
      <thead style="text-align:left;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--muted)">
        <tr><th style="padding:.75rem">#</th><th style="padding:.75rem">Title</th><th style="padding:.75rem">Tags</th><th style="padding:.75rem">Status</th><th style="padding:.75rem;text-align:right">Actions</th></tr>
      </thead>
      <tbody id="dashRows"></tbody>
    </table>
  </div>`;
  const tbody = document.getElementById('dashRows'); tbody.innerHTML = '';
  scripts.forEach((s, idx) => {
    const tr = document.createElement('tr'); tr.style.borderBottom = '1px solid rgba(255,255,255,0.02)';
    tr.innerHTML = `
      <td style="padding:.75rem;vertical-align:middle">#${idx}</td>
      <td style="padding:.75rem;vertical-align:middle;color:white;font-weight:600">${escapeHtml(s.title)}</td>
      <td style="padding:.75rem;vertical-align:middle">${escapeHtml((s.tags||[]).join(', '))}</td>
      <td style="padding:.75rem;vertical-align:middle">${s.is_verified?'<span class="status verified">Verified</span>':'<span class="status unverified">Unverified</span>'}</td>
      <td style="padding:.75rem;vertical-align:middle;text-align:right">
        <button class="btn" data-action="edit" data-idx="${idx}">Edit</button>
        <button class="btn" data-action="toggle" data-idx="${idx}">${s.is_verified?'Unverify':'Verify'}</button>
        <button class="btn danger" data-action="delete" data-idx="${idx}">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('[data-action="edit"]').forEach(b => b.addEventListener('click', (e)=>{
    const idx = Number(e.currentTarget.getAttribute('data-idx')); openEditModalByIndex(idx);
  }));
  tbody.querySelectorAll('[data-action="toggle"]').forEach(b => b.addEventListener('click', async (e)=>{
    const idx = Number(e.currentTarget.getAttribute('data-idx'));
    try{ await updateScriptInDb(idx, {...scripts[idx], isVerified: !scripts[idx].is_verified}); showToast('Toggled'); loadScriptsFromDb(); } catch(err){ console.error(err); showToast('Update failed'); }
  }));
  tbody.querySelectorAll('[data-action="delete"]').forEach(b => b.addEventListener('click', async (e)=>{
    const idx = Number(e.currentTarget.getAttribute('data-idx'));
    if (!confirm('Delete this script?')) return;
    try{ await deleteScriptInDb(idx); showToast('Deleted'); loadScriptsFromDb(); } catch(err){ console.error(err); showToast('Delete failed'); }
  }));
}

function renderScriptDetail(index){
  const s = scripts[index];
  if (!s){
    root.innerHTML = `<div style="padding:3rem 0;text-align:center;color:var(--muted);font-family:JetBrains Mono">Script not found</div>`;
    return;
  }
  const adminActionButtons = isAdmin() ? `<button class="btn" id="viewEdit">Edit</button>` : '';
  const adminSideButtons = isAdmin() ? `<button class="btn" id="detailToggle">${s.is_verified?'Unverify':'Verify'}</button><button class="btn danger" id="detailDelete">Delete</button>` : '';
  root.innerHTML = `
    <div style="display:flex;gap:1rem;flex-wrap:wrap;padding-top:1rem">
      <div style="flex:1;min-width:280px">
        <div class="card">
          <h3>${escapeHtml(s.title)}</h3>
          <div class="meta" style="margin-bottom:.6rem">
            <div>${escapeHtml((s.tags||[]).join(', ')||'-')}</div>
            <div style="margin-left:auto" class="status ${s.is_verified ? 'verified':'unverified'}">${s.is_verified ? iconVerified() : iconUnverified()}<span>${s.is_verified ? 'Verified' : 'Unverified'}</span></div>
          </div>
          <div style="margin-top:.6rem">${(s.tags||[]).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
          <pre style="margin-top:.9rem;"><code>${escapeHtml(s.code)}</code></pre>
          <div style="margin-top:1rem;display:flex;gap:.5rem;justify-content:flex-end">
            <button class="btn" id="viewCopy">Copy</button>
            ${adminActionButtons}
          </div>
        </div>
      </div>
      <div style="flex:1;min-width:260px">
        <div class="card">
          <h3 style="margin-top:0">Actions</h3>
          <div style="display:flex;flex-direction:column;gap:.6rem">
            ${adminSideButtons}
            <button class="btn" id="backBtn">Back</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('viewCopy').addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(s.code); showToast('Copied code'); } catch { showToast('Copy failed'); }});
  if (isAdmin()){
    document.getElementById('viewEdit').addEventListener('click', ()=> openEditModalByIndex(index));
    document.getElementById('detailToggle').addEventListener('click', async ()=>{ try{ await updateScriptInDb(index, {...s, isVerified: !s.is_verified}); showToast('Toggled'); loadScriptsFromDb(); } catch { showToast('Update failed'); }});
    document.getElementById('detailDelete').addEventListener('click', async ()=>{ if (!confirm('Delete this script?')) return; try{ await deleteScriptInDb(index); showToast('Deleted'); location.hash='#/'; } catch { showToast('Delete failed'); }});
  }
  document.getElementById('backBtn').addEventListener('click', ()=> location.hash = '#/');
}

function renderAddPage(){
  root.innerHTML = `
    <div style="max-width:900px;margin:1rem auto">
      <div class="card">
        <h3>Add New Script</h3>
        <div style="display:flex;flex-direction:column;gap:.6rem">
          <input id="addTitle" placeholder="Title (required)" />
          <input id="addTags" placeholder="Tags (comma separated)" />
          <textarea id="addCode" placeholder="Code (required)"></textarea>
          <div style="display:flex;gap:.5rem;justify-content:flex-end">
            <button class="btn" id="addSave">Save</button>
            <button class="btn" id="addCancel">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('addCancel').addEventListener('click', ()=> location.hash = '#/');
  document.getElementById('addSave').addEventListener('click', async ()=> {
    const title = document.getElementById('addTitle').value.trim();
    const tags = document.getElementById('addTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const code = document.getElementById('addCode').value.trim();
    if (!title || !code){ showToast('Title and code required'); return; }
    try{ await addScriptToDb({ title, tags, code, isVerified:false }); showToast('Script added'); location.hash='#/'; } catch(err){ console.error(err); showToast('Add failed'); }
  });
}

function openEditModalByIndex(index){
  const script = scripts[index];
  if (!script) return;
  modalContainer.style.display = 'block';
  modalContainer.innerHTML = `
    <div class="modal-backdrop" role="dialog" aria-modal="true">
      <div class="modal">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3>Edit Script #${index}</h3>
          <div style="display:flex;gap:.5rem">
            <button class="btn" id="modalSave">Save</button>
            <button class="btn" id="modalClose">Close</button>
          </div>
        </div>
        <div style="margin-top:.8rem">
          <div class="form-row">
            <input type="text" id="editTitle" placeholder="Title" value="${escapeAttr(script.title)}" />
          </div>
          <div class="form-row">
            <input type="text" id="editTags" placeholder="Tags (comma separated)" value="${escapeAttr((script.tags||[]).join(','))}" />
            <label style="display:flex;align-items:center;gap:.5rem"><input type="checkbox" id="editVerified" ${script.is_verified ? 'checked' : ''}/> Verified</label>
          </div>
          <div style="margin-top:.6rem">
            <textarea id="editCode" placeholder="Code">${escapeHtml(script.code)}</textarea>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalSave').addEventListener('click', async ()=> {
    const title = document.getElementById('editTitle').value.trim();
    const tags = document.getElementById('editTags').value.split(',').map(t=>t.trim()).filter(Boolean);
    const code = document.getElementById('editCode').value.trim();
    const verified = document.getElementById('editVerified').checked;
    if (!title || !code){ showToast('Title and code required'); return; }
    try{ await updateScriptInDb(index, { title, tags, code, isVerified: verified }); closeModal(); showToast('Saved'); loadScriptsFromDb(); } catch (err){ console.error(err); showToast('Save failed'); }
  });
  modalContainer.querySelector('.modal-backdrop').addEventListener('click', e => { if (e.target.classList.contains('modal-backdrop')) closeModal(); });
}

function closeModal(){ modalContainer.style.display='none'; modalContainer.innerHTML=''; }

function promptAdmin(){
  const key = prompt('Enter moderator key:');
  if (!key) return;
  if (key === MODERATOR_KEY){ setAdmin(key); showToast('Moderator signed in'); } else { showToast('Invalid key'); }
}

adminBtn.addEventListener('click', ()=> {
  if (isAdmin()){ if (confirm('Sign out moderator?')) { setAdmin(null); showToast('Signed out'); } }
  else promptAdmin();
});

document.querySelectorAll('.nav-link').forEach(a => a.addEventListener('click', ()=> setTimeout(()=> setActiveNav(a.getAttribute('data-route')), 1)));

(function init(){ loadScriptsFromDb(); subscribeRealtime(); updateAdminUI(); router(); })();

window._wicpz = {
  getScripts: () => scripts,
  signIn: (k) => { setAdmin(k); },
  signOut: () => setAdmin(null),
  clearAll: () => { scripts = []; saveScriptsToStorage(); loadScriptsFromDb(); }
};
</script>

<footer>
  <div>No NSFW content allowed.</div>
</footer>
</body>
</html>
